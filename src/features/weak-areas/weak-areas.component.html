<div class="page">
  <div class="card">
    <h1>Weak Areas</h1>

    <div class="section">
      <div class="section-title">
        Weak Questions ({{ totalPendingReviews }})
      </div>

      @for (topic of reviewTopics; track topic.title) {
        <div class="topic-section">
          <div class="topic-header">
            <span class="topic-title">
              {{ topic.title }}
            </span>

            <span class="topic-count">
              {{ topic.total }}
            </span>
          </div>

          @for (review of topic.exercises; track review.exercise.mode) {
            @if (review.count > 0) {
              <div
                class="review-row clickable"
                (click)="openWeakArea(review.exercise)"
              >
                <div class="review-title">
                  {{ review.exercise.title }}
                </div>

                <div class="review-actions">
                  <span class="review-count">
                    {{ review.count }}
                  </span>

                  <span class="review-arrow"> ❯ </span>
                </div>
              </div>
            }
          }
        </div>
      }
    </div>
  </div>
</div>
