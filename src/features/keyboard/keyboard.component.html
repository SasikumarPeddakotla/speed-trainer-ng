<div class="keyboard" aria-label="Number keyboard">
  @for (row of keys; track $index) {
    <div class="row">
      @for (key of row; track key) {
        <button
          type="button"
          [attr.aria-label]="key === '/' ? 'Divide' : key"
          (pointerdown)="press(key)"
        >
          {{ key }}
        </button>
      }
    </div>
  }
</div>
