@if(filteredArticles().length>0){
<div class="reference-grid">
  @for (article of filteredArticles(); track article.article) {
    <div class="reference-card">
      <div class="card-header">
        <h3>Article {{ article.article }}</h3>
        <button
          type="button"
          class="bookmark-btn"
          [class.bookmarked]="isBookmarked(article)"
          (click)="toggleBookmark(article)"
        >
          &#9733;
        </button>
      </div>

      <div class="divider"></div>

      <h4>{{ article.title }}</h4>

      @if (article.part) {
        <p class="part">{{ article.part }}</p>
      }
    </div>
  }
</div>
}
@else{
  <p class="no-data">
    No data available
  </p>
}
