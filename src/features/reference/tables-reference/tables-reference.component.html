<div class="tables-grid">
  @for (table of tables; track table) {
    <div class="table-card">
      <h3>{{ table }} Table</h3>

      @for (multiplier of multipliers; track multiplier) {
        <div class="table-row">
          <span>{{ table }} × {{ multiplier }}</span>
          <span>=</span>
          <span>{{ table * multiplier }}</span>
        </div>
      }
    </div>
  }
</div>
