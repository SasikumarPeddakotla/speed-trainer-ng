@if (conversions().length > 0) {
  <div class="conversion-table-container">
    <table class="conversion-table">
      <thead>
        <tr>
          <th>Fraction</th>
          <th>Percentage</th>
          <th>Decimal</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        @for (conversion of conversions(); track conversion.fraction) {
          <tr>
            <td>{{ conversion.fraction }}</td>
            <td>{{ conversion.percentage }}%</td>
            <td>{{ conversion.decimal }}</td>
            <td>
              <button
                type="button"
                class="bookmark-btn"
                [class.bookmarked]="isBookmarked(conversion)"
                (click)="toggleBookmark(conversion)"
              >
                &#9733;
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @else {
  <p class="no-data">No data available</p>
}
