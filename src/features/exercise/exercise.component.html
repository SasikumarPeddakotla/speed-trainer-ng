<div class="page">
  <main class="exercise-card">
    <!-- Header -->
    <header class="exercise-header">
      <div class="breadcrumb">Topic</div>

      <h1>{{ topicName | titlecase }}</h1>

      <p>Choose an exercise to practice</p>
    </header>

    <!-- Exercises -->
    <section class="exercises-section">
      <div class="section-title">Exercises</div>

      <div class="exercise-list">
        @for (exercise of exercises; track exercise.route) {
          <button
            type="button"
            class="exercise-item"
            [class.not-implemented]="!exercise.implemented"
            (click)="openExercise(exercise)"
          >
            <div class="exercise-content">
              <div class="exercise-title">
                {{ exercise.title }}
              </div>

              @if (!exercise.implemented) {
                <span class="coming-soon">Coming Soon</span>
              }
            </div>

            <span class="arrow">›</span>
          </button>
        }
      </div>
    </section>
  </main>
</div>
