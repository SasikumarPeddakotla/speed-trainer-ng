<div class="page">
  <main class="topic-card">
    <!-- Header -->
    <header class="topic-header">
      <div class="breadcrumb">Subject</div>

      <h1>{{ subjectName | titlecase }}</h1>

      <p>Choose a topic to continue</p>
    </header>

    <!-- Topics -->
    <section class="topics-section">
      <div class="section-title">Topics</div>

      <div class="topic-list">
        @for (topic of topics; track topic.route) {
          <button
            type="button"
            class="topic-item"
            [class.not-implemented]="!topic.implemented"
            (click)="openTopic(topic)"
          >
            <div class="topic-content">
              <div class="topic-title">
                {{ topic.title }}
              </div>

              @if (!topic.implemented) {
                <span class="coming-soon">Coming Soon</span>
              }
            </div>

            <span class="arrow">›</span>
          </button>
        }
      </div>
    </section>
  </main>
</div>
