<div class="page">
  <main class="home-card">
    <!-- Header -->
    <header class="home-header">
      <div class="app-icon">⚡</div>

      <h1>Speed Trainer</h1>

      <p>Choose a subject to start practicing</p>
    </header>

    <!-- Subjects -->
    <section class="section">
      <h2 class="section-title">Subjects</h2>

      <div class="menu-list">
        @for (subject of subjects; track subject.route) {
          <button
            type="button"
            class="menu-card"
            (click)="openSubject(subject)"
          >
            <div class="menu-content">
              <div class="icon">
                {{ subject.icon }}
              </div>

              <div class="text">
                <div class="title">
                  {{ subject.title }}
                </div>
              </div>
            </div>

            <span class="arrow">›</span>
          </button>
        }
      </div>
    </section>
